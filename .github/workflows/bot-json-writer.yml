name: Bot Commit Metadata Tracker

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'index.json'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'index.json'

# STRICT RBAC: Global baseline drops all write permissions
permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. READ-ONLY AUDIT FOR PULL REQUESTS (FORK ISOLATION)
  # STRICT SECURITY: Ensure pull_request events ONLY have 'contents: read' to
  # block malicious actors from exploiting the bot's write token via untrusted PRs.
  # ────────────────────────────────────────────────────────────────────────────
  audit-pr-fork:
    name: Audit Fork PR (Strictly Read-Only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR Head (No Token Persistence)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify Tracker Schema Integrity
        run: |
          echo "Executing read-only audit for PR #${{ github.event.pull_request.number }} from fork..."
          python3 -c "
          import json, os, sys
          tracker = 'index.json'
          if os.path.exists(tracker):
              try:
                  with open(tracker, 'r', encoding='utf-8') as f:
                      data = json.load(f)
                  print('index.json JSON structure is valid.')
              except Exception as err:
                  print(f'JSON syntax violation in tracker: {err}', file=sys.stderr)
                  sys.exit(1)
          else:
              print('No tracker index.json detected in PR; audit passed.')
          "

  # ────────────────────────────────────────────────────────────────────────────
  # 2. WRITE-ISOLATED COMMIT METADATA LOGGER
  # STRICT RBAC: Write permissions are isolated exclusively to this job and
  # MUST ONLY trigger on push to the 'main' branch.
  # ────────────────────────────────────────────────────────────────────────────
  append-commit-tracker:
    name: Parse & Append Commit Metadata
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Main Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse Commit Metadata and Append to index.json
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_REF_NAME: ${{ github.ref_name }}
          COMMIT_AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          COMMIT_AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          RUN_ID: ${{ github.run_id }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - << 'EOF'
          import os
          import json
          import subprocess
          from datetime import datetime, timezone

          tracker_file = "index.json"

          # Safely retrieve parameters from environment variables (immune to shell injection)
          sha = os.environ.get("COMMIT_SHA", "")
          branch = os.environ.get("COMMIT_REF_NAME", "main")
          author_name = os.environ.get("COMMIT_AUTHOR_NAME") or "Unknown Author"
          author_email = os.environ.get("COMMIT_AUTHOR_EMAIL") or "unknown@voxionlabs.internal"
          message = os.environ.get("COMMIT_MESSAGE") or "No commit message provided"
          timestamp = os.environ.get("COMMIT_TIMESTAMP") or datetime.now(timezone.utc).isoformat()
          commit_url = os.environ.get("COMMIT_URL") or f"https://github.com/{os.environ.get('REPOSITORY', '')}/commit/{sha}"
          run_id = os.environ.get("RUN_ID", "")
          actor = os.environ.get("ACTOR", "")
          repo = os.environ.get("REPOSITORY", "Voxion-Labs/FluxKernel")

          # Inspect modified files
          try:
              changed_files = subprocess.check_output(
                  ["git", "diff-tree", "--no-commit-id", "--name-only", "-r", sha],
                  text=True
              ).strip().splitlines()
          except Exception:
              changed_files = []

          # Build structured commit entry
          entry = {
              "sha": sha,
              "branch": branch,
              "message": message.strip(),
              "author": {
                  "name": author_name,
                  "email": author_email,
                  "actor": actor
              },
              "timestamp": timestamp,
              "commit_url": commit_url,
              "run_id": run_id,
              "files_modified": changed_files,
              "recorded_at": datetime.now(timezone.utc).isoformat()
          }

          # Load or initialize tracker file
          if os.path.exists(tracker_file):
              try:
                  with open(tracker_file, "r", encoding="utf-8") as f:
                      tracker_data = json.load(f)
              except Exception:
                  tracker_data = {
                      "schema_version": "1.0.0",
                      "repository": repo,
                      "commits": []
                  }
          else:
              tracker_data = {
                  "schema_version": "1.0.0",
                  "repository": repo,
                  "commits": []
              }

          # Check deduplication and append
          if isinstance(tracker_data, list):
              existing_shas = {c.get("sha") for c in tracker_data if isinstance(c, dict)}
              if sha not in existing_shas:
                  tracker_data.insert(0, entry)
          else:
              commits = tracker_data.setdefault("commits", [])
              existing_shas = {c.get("sha") for c in commits if isinstance(c, dict)}
              if sha not in existing_shas:
                  commits.insert(0, entry)
              tracker_data["last_updated"] = datetime.now(timezone.utc).isoformat()
              tracker_data["total_commits_tracked"] = len(commits)

          # Atomic write
          with open(tracker_file, "w", encoding="utf-8") as f:
              json.dump(tracker_data, f, indent=2, ensure_ascii=False)
              f.write("\n")

          print(f"Recorded commit {sha[:8]} into {tracker_file}")
          EOF

      - name: Commit and Push Tracker Update
        run: |
          git config --local user.name "fluxkernel-bot[bot]"
          git config --local user.email "fluxkernel-bot[bot]@users.noreply.github.com"
          git add index.json
          if git diff --staged --quiet; then
            echo "No changes detected in index.json. Tracker is up to date."
          else
            git commit -m "chore(bot): record commit ${GITHUB_SHA::8} in index.json [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
