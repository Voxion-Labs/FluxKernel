name: Enterprise CI/CD Pipeline (Go, C++, Python)

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. C++ ENGINE: LINT, BUILD, AND TEST SUITE
  # ────────────────────────────────────────────────────────────────────────────
  cpp-pipeline:
    name: C++ (${{ matrix.compiler.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - name: GCC-13
            cc: gcc-13
            cxx: g++-13
            pkg: gcc-13 g++-13
          - name: Clang-17
            cc: clang-17
            cxx: clang++-17
            pkg: clang-17 lld-17

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install Toolchain and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ${{ matrix.compiler.pkg }} \
            cmake \
            ninja-build \
            clang-format \
            clang-tidy \
            cppcheck \
            libboost-all-dev

      - name: Lint C++ Source Formatting
        run: |
          echo "Scanning C++ files for clang-format compliance..."
          CPP_FILES=$(find native -type f \( -name "*.cpp" -o -name "*.hpp" -o -name "*.cc" -o -name "*.h" \) \
            -not -path "./node_modules/*" -not -path "./build/*" -not -path "./.git/*")
          if [ -n "$CPP_FILES" ]; then
            clang-format --dry-run $CPP_FILES
          else
            echo "No C++ files detected in native/; formatting check skipped."
          fi

      - name: Static Analysis with Cppcheck
        run: |
          echo "Executing Cppcheck static analysis on native module..."
          CPP_FILES=$(find native -type f \( -name "*.cpp" -o -name "*.cc" \))
          if [ -n "$CPP_FILES" ]; then
            cppcheck --enable=warning,performance,portability \
              --inline-suppr \
              --error-exitcode=1 \
              -I native/include \
              $CPP_FILES
          else
            echo "No C++ implementation files detected; static analysis skipped."
          fi

      - name: Build & Test Native C++ Target
        env:
          CC: ${{ matrix.compiler.cc }}
          CXX: ${{ matrix.compiler.cxx }}
        run: |
          echo "Configuring CMake project from native/..."
          cmake -S native -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          echo "Compiling C++ binary and shared library targets..."
          cmake --build build --parallel $(nproc)
          echo "Executing CTest test suite..."
          ctest --test-dir build --output-on-failure

  # ────────────────────────────────────────────────────────────────────────────
  # 2. GO SERVICE: LINT, BUILD, AND TEST SUITE
  # ────────────────────────────────────────────────────────────────────────────
  go-pipeline:
    name: Go Engine (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.22', '1.23']

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: Go Format and Vet Check
        working-directory: gateway
        run: |
          echo "Checking gofmt..."
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Unformatted Go files detected:"
            echo "$UNFORMATTED"
            exit 1
          fi
          echo "Running go vet..."
          go vet ./...

      - name: Build and Test Go Gateway
        working-directory: gateway
        run: |
          echo "Compiling Go binary..."
          go build -v ./...
          echo "Running Go test suite..."
          go test -v -race ./...

  # ────────────────────────────────────────────────────────────────────────────
  # 3. PYTHON BACKEND (ENGINE): LINT & TEST
  # ────────────────────────────────────────────────────────────────────────────
  python-pipeline:
    name: Python Engine (3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: engine/requirements.txt

      - name: Install System & Linting Tools
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            portaudio19-dev \
            libasound2-dev \
            libpq-dev
          python -m pip install --upgrade pip
          pip install ruff pytest

      - name: Lint Python Codebase with Ruff
        run: |
          echo "Running Ruff linter..."
          ruff check engine/
          echo "Checking formatting compliance..."
          ruff format --check engine/

      - name: Install Backend Dependencies
        run: |
          pip install -r engine/requirements.txt

      - name: Execute Python Test Suite
        run: |
          echo "Running backend test discovery with pytest..."
          PYTHONPATH=engine pytest -v engine/tests/
          echo "Verifying zero-dependency standalone execution (bare-metal fallback)..."
          python engine/tests/test_native_bridge.py
          python engine/tests/test_code_executor.py
          python engine/tests/test_sandbox_security.py
          python engine/tests/test_rollback_manager.py
          python engine/tests/test_agentic_loop.py
          python engine/tests/test_universal_rag.py
          python engine/tests/test_web_intelligence.py
          python engine/tests/test_chat_ingestor.py
          python engine/tests/test_feedback_learner.py
          python engine/tests/test_e2e_triumvirate.py

  # ────────────────────────────────────────────────────────────────────────────
  # 4. CONTAINER BUILD VERIFICATION (MULTI-STAGE DOCKERFILE)
  # ────────────────────────────────────────────────────────────────────────────
  docker-verification:
    name: Docker Multi-Stage Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: fluxkernel:ci-verify

  # ────────────────────────────────────────────────────────────────────────────
  # 5. CI SUCCESS GATE
  # ────────────────────────────────────────────────────────────────────────────
  ci-gate:
    name: CI Pipeline Status Check
    needs: [cpp-pipeline, go-pipeline, python-pipeline, docker-verification]
    runs-on: ubuntu-latest
    steps:
      - name: Gate Check Confirmation
        run: echo "All multi-stage builds, linting, tests, and container verifications passed."
