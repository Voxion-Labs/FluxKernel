# ==============================================================================
# Voxion Labs - FluxKernel Infrastructure Blueprint (Sub-Engine Scope)
# Zero-Downtime Production Deployment Specification
# ==============================================================================
version: "1"

services:
  - type: web
    name: fluxkernel-api
    runtime: docker
    region: oregon
    plan: starter
    rootDir: kernel-engine
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    numInstances: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: fluxkernel-db
          property: connectionString
      - key: LOCAL_LLM_URL
        value: http://localhost:11434

databases:
  - name: fluxkernel-db
    plan: starter
    databaseName: fluxkernel
    user: fluxuser
    region: oregon
