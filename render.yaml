# ==============================================================================
# Voxion Labs - FluxKernel Infrastructure Blueprint
# Zero-Downtime Production Deployment Specification
# ==============================================================================
version: "1"

services:
  # ── FluxKernel Core API Engine (FastAPI + Go + C++ Hybrid) ──────────────────
  - type: web
    name: fluxkernel-api
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    numInstances: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: fluxkernel-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: fluxkernel-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: fluxkernel-redis
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: fluxkernel-redis
          property: connectionString
      - key: LOCAL_LLM_URL
        value: http://localhost:11434

  # ── FluxKernel Background Task Worker (Celery Queue Processor) ──────────────
  - type: worker
    name: fluxkernel-worker
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: celery -A app.core.task_queue.celery_app worker --loglevel=info --concurrency=4 --queues=celery
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fluxkernel-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: fluxkernel-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: fluxkernel-redis
          property: connectionString

  # ── Managed High-Throughput Redis Cache & Task Broker ───────────────────────
  - type: redis
    name: fluxkernel-redis
    region: oregon
    plan: starter
    ipAllowList: [] # Strict VPC Isolation
    maxmemoryPolicy: allkeys-lru

# ── Managed PostgreSQL Cluster ────────────────────────────────────────────────
databases:
  - name: fluxkernel-db
    databaseName: fluxkernel
    user: fluxuser
    region: oregon
    plan: starter
    ipAllowList: [] # Strict VPC Isolation
